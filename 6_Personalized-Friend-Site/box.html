<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Box | For Janhvi</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .box-hero { text-align: center; margin-bottom: 10px; }
  .box-hero h1 { font-size: clamp(2rem, 5vw, 3rem); font-style: italic; }
  .box-hero p { max-width: 540px; margin: 0 auto; color: var(--berry); font-weight: 600; }

  .stage {
    position: relative;
    width: min(560px, 92vw);
    aspect-ratio: 1;
    margin: 50px auto 20px;
  }

  
  .box-base {
    position: absolute;
    bottom: -6%;
    left: 50%;
    transform: translateX(-50%);
    width: 70%;
    height: 30%;
    background: linear-gradient(160deg, var(--rose-deep), var(--berry));
    border-radius: 18px 18px 30px 30px;
    box-shadow: var(--shadow-lift);
  }
  .box-base::before {
    content: '';
    position: absolute;
    top: 10px; left: 10px; right: 10px;
    height: 10px;
    background: rgba(255,255,255,0.25);
    border-radius: 6px;
  }
  .box-lid-jewel {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 26px;
    height: 26px;
    background: radial-gradient(circle at 35% 30%, #fff, var(--gold));
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(212,165,116,0.8);
  }

  
  .ring {
    position: absolute;
    inset: 0;
  }

  .photo-frame {
    position: absolute;
    top: 50%; left: 50%;
    width: 108px;
    height: 108px;
    margin: -54px 0 0 -54px;
    border-radius: 50%;
    border: 5px solid white;
    box-shadow: 0 8px 22px rgba(139,58,82,0.3);
    overflow: hidden;
    cursor: pointer;
    transition: box-shadow 0.2s ease;
  }
  .photo-frame:hover { box-shadow: 0 10px 28px rgba(139,58,82,0.5); z-index: 5; }

  .photo-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }

  
  .ballerina {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 3.4rem;
    animation: twirl 4s ease-in-out infinite;
    filter: drop-shadow(0 6px 10px rgba(139,58,82,0.3));
  }
  @keyframes twirl {
    0%, 100% { transform: translate(-50%, -50%) rotate(-8deg) scale(1); }
    50% { transform: translate(-50%, -50%) rotate(8deg) scale(1.05); }
  }

  .box-controls {
    text-align: center;
    margin-top: 30px;
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  
  .card-overlay {
    position: fixed;
    inset: 0;
    background: rgba(61, 31, 46, 0.55);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 300;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    padding: 20px;
  }
  .card-overlay.show { opacity: 1; pointer-events: all; }
  .memory-card {
    background: white;
    border-radius: 28px;
    max-width: 420px;
    width: 100%;
    overflow: hidden;
    box-shadow: var(--shadow-lift);
    text-align: center;
    transform: scale(0.85) rotate(-2deg);
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  .card-overlay.show .memory-card { transform: scale(1) rotate(0deg); }
  .memory-card img { width: 100%; display: block; max-height: 340px; object-fit: cover; }
  .memory-card .caption {
    padding: 22px 26px 28px;
  }
  .memory-card .caption h3 {
    font-style: italic;
    font-size: 1.3rem;
    margin-bottom: 8px;
  }
  .memory-card .caption p { color: #7a5566; font-size: 0.95rem; }
  .close-card {
    margin: 14px 0 0;
    background: var(--cream-2);
    border: none;
    border-radius: 999px;
    padding: 10px 24px;
    font-weight: 700;
    color: var(--berry);
    cursor: pointer;
  }

  .today-banner {
    max-width: 640px;
    margin: 60px auto 0;
    text-align: center;
  }
  .banner-card {
    background: linear-gradient(160deg, #fff, var(--cream-2));
    border: 2px solid var(--gold-soft);
    border-radius: 20px;
    padding: 30px;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.3rem;
    color: var(--berry);
    box-shadow: var(--shadow-soft);
  }
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Jaan-hvi 🩷</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="box.html">Memory Box</a></li>
    <li><a href="games.html">Play</a></li>
  </ul>
</nav>

<main>
  <div class="box-hero">
    <p class="eyebrow">the music box</p>
    <h1>you, dancing in circles since forever</h1>
    <p>you were literally a ballerina once, so this felt right. tap any photo to open its little card. tap the box to pause the spin.</p>
  </div>

  <div class="stage" id="stage">
    <div class="ring" id="ring"></div>
    <div class="ballerina" id="ballerina-figure">🩰</div>
    <div class="box-base"><div class="box-lid-jewel"></div></div>
  </div>

  <div class="box-controls">
    <button class="btn" id="pause-toggle">⏸ pause the spin</button>
    <button class="btn secondary" id="music-toggle">🎵 play the music box tune</button>
  </div>

  <div class="today-banner">
    <div class="banner-card" id="daily-card">loading today's little note...</div>
  </div>
</main>

<div class="card-overlay" id="card-overlay">
  <div class="memory-card" id="memory-card">
    <img id="memory-img" src="" alt="">
    <div class="caption">
      <h3 id="memory-title"></h3>
      <p id="memory-sub"></p>
      <button class="close-card" id="close-card">close, back to spinning</button>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script>
  const photos = [
    { src: 'images/balcony-trio.jpeg', title: "the balcony one", sub: "three of you, one railing, zero bad angles. today is a great day, just like this one was." },
    { src: 'images/baby-ballerina.jpeg', title: "baby ballerina jaanu", sub: "look at her. tiny, pink, and already stealing the show. still true today." },
    { src: 'images/baby-cartwheel.jpeg', title: "the cartwheel era", sub: "fearless then, fearless now. you've just forgotten it for a second." },
    { src: 'images/pink-saree.jpeg', title: "pink and pretty", sub: "your favourite colour, on your favourite person. as it should be." },
    { src: 'images/pizza-hearts.jpeg', title: "believe in the power of pizza", sub: "and also the power of you, being ridiculous and happy in a pizza place." },
    { src: 'images/yellow-wall.jpeg', title: "that golden wall moment", sub: "you looked so happy here. that happiness is still somewhere in you today, i promise." }
  ];

  const ring = document.getElementById('ring');
  const frames = [];
  photos.forEach((p, i) => {
    const frame = document.createElement('div');
    frame.className = 'photo-frame';
    frame.innerHTML = `<img src="${p.src}" alt="${p.title}" loading="lazy">`;
    frame.addEventListener('click', () => openCard(p));
    ring.appendChild(frame);
    frames.push({ el: frame, baseAngle: (360 / photos.length) * i });
  });

  const RADIUS = 190;
  const SPIN_SECONDS = 34; 
  let spinning = true;
  let startTime = performance.now();
  let pausedAt = 0;

  function positionFrames(now) {
    const elapsed = spinning ? (now - startTime + pausedAt) : pausedAt;
    const globalAngle = (elapsed / (SPIN_SECONDS * 1000)) * 360;
    frames.forEach(f => {
      const angle = (f.baseAngle + globalAngle) * (Math.PI / 180);
      const x = Math.cos(angle) * RADIUS;
      const y = Math.sin(angle) * RADIUS;
      f.el.style.transform = `translate(${x}px, ${y}px)`;
    });
    if (spinning) requestAnimationFrame(positionFrames);
  }
  requestAnimationFrame(positionFrames);

  function toggleSpin() {
    if (spinning) {
      pausedAt = performance.now() - startTime + pausedAt;
      spinning = false;
    } else {
      startTime = performance.now();
      spinning = true;
      requestAnimationFrame(positionFrames);
    }
  }

  function openCard(p) {
    document.getElementById('memory-img').src = p.src;
    document.getElementById('memory-img').alt = p.title;
    document.getElementById('memory-title').textContent = p.title;
    document.getElementById('memory-sub').textContent = p.sub;
    document.getElementById('card-overlay').classList.add('show');
    playPop(500);
  }
  document.getElementById('close-card').addEventListener('click', () => {
    document.getElementById('card-overlay').classList.remove('show');
  });
  document.getElementById('card-overlay').addEventListener('click', (e) => {
    if (e.target.id === 'card-overlay') document.getElementById('card-overlay').classList.remove('show');
  });

  // Pause toggle
  document.getElementById('pause-toggle').addEventListener('click', (e) => {
    toggleSpin();
    e.target.textContent = spinning ? '⏸ pause the spin' : '▶ resume the spin';
    playPop(400);
  });
  document.getElementById('stage').addEventListener('click', (e) => {
    if (e.target.id === 'stage' || e.target.closest('.box-base')) {
      document.getElementById('pause-toggle').click();
    }
  });

  
  const musicBtn = document.getElementById('music-toggle');
  musicBtn.addEventListener('click', () => {
    const on = MusicBox.toggle();
    musicBtn.textContent = on ? '🎶 tune playing...' : '🎵 play the music box tune';
  });

  
  const dailyLines = [
    "today is a great day. no evidence needed, it's just decided.",
    "you are doing so much better than you think you are right now.",
    "reminder: you are somebody's favourite person to text back. mine.",
    "whatever today's plot is, you're still the main character and she's winning.",
    "you have survived every single bad day so far. 100% success rate, jaanu.",
    "someone (me) is extremely proud of you today for just existing.",
    "your pink era is not over. it's actually just getting started.",
    "you're allowed to rest today. the world can wait a bit.",
    "you make ordinary days better just by being in them.",
    "drama queen behaviour is allowed today. embrace it, it's cute on you."
  ];
  const dayIdx = Math.floor(Date.now() / (1000 * 60 * 60 * 24)) % dailyLines.length;
  document.getElementById('daily-card').textContent = dailyLines[dayIdx];
</script>
</body>
</html>
